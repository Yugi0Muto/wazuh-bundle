<!-- Whodata : QUI a modifié le fichier. Linux : nécessite auditd (installé par le script agent). -->
<agent_config os="Linux">
  <syscheck>
    <directories whodata="yes" check_all="yes">/etc/ssh</directories>
    <directories whodata="yes" check_all="yes">/root</directories>
  </syscheck>
</agent_config>
<agent_config os="Windows">
  <syscheck>
    <directories whodata="yes" check_all="yes">%WINDIR%\System32\drivers\etc</directories>
  </syscheck>
</agent_config>
