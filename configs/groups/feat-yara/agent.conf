<!-- Surveillance des répertoires analysés par YARA (voir règles 100501/100502).
     Doit rester cohérent avec YARA_SCAN_PATHS_REGEX de bundle.conf. -->
<agent_config os="Linux">
  <syscheck>
    <directories check_all="yes" realtime="yes">/var/www</directories>
    <directories check_all="yes" realtime="yes">/tmp,/var/tmp,/dev/shm</directories>
    <!-- /home en contrôle planifié (la surveillance temps réel est limitée par inotify) -->
    <directories check_all="yes">/home</directories>
  </syscheck>
</agent_config>
