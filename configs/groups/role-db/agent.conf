<agent_config os="Linux">
  <syscheck>
    <!-- Fichiers de configuration uniquement : les données changent en permanence -->
    <directories check_all="yes" realtime="yes">/etc/mysql</directories>
    <directories check_all="yes" realtime="yes">/etc/postgresql</directories>
    <ignore>/var/lib/mysql</ignore>
    <ignore>/var/lib/postgresql</ignore>
  </syscheck>
  <localfile><log_format>syslog</log_format><location>/var/log/mysql/error.log</location></localfile>
  <localfile><log_format>syslog</log_format><location>/var/log/postgresql/postgresql-*.log</location></localfile>
</agent_config>
